name: Deploy Backend (Cloudflare Workers)

"on":
  push:
    branches: [main]
    paths:
      - "backend-workers/**"
  workflow_dispatch: 

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Setup Database, Secrets and Deploy
        env:
          OLD_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OLD_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "=== 1. Generating & Setting Secure Secrets ==="
          node -e "console.log(require('crypto').randomBytes(32).toString('hex'))" | npx wrangler secret put JWT_SECRET
          node -e "console.log(require('crypto').randomBytes(32).toString('hex'))" | npx wrangler secret put ENCRYPTION_MASTER_KEY

          echo "=== 2. Creating Cloudflare Hyperdrive ==="
          # Added the URL-encoded SSL requirement to the end of the connection string to prevent the AuthSwitchRequest error
          OUTPUT=$(npx wrangler hyperdrive create smartgen-db --connection-string="mysql://2JngFiPXLuM2pkK.root:isV7NPF710XPESwD@gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/fanchatbot?ssl=%7B%22rejectUnauthorized%22%3Atrue%7D")
          
          echo "=== 3. Extracting Hyperdrive ID ==="
          HYPERDRIVE_ID=$(echo "$OUTPUT" | grep -o 'id: "[^"]*"' | cut -d'"' -f2)
          
          if [ -z "$HYPERDRIVE_ID" ]; then
            echo "Warning: Could not automatically find the ID. Raw output was:"
            echo "$OUTPUT"
          else
            echo "Successfully found Hyperdrive ID: $HYPERDRIVE_ID"
            echo "Injecting ID into wrangler.jsonc..."
            sed -i "s/REPLACE_WITH_YOUR_HYPERDRIVE_ID/$HYPERDRIVE_ID/g" wrangler.jsonc
          fi

          echo "=== 4. Deploying to Cloudflare Workers ==="
          npx wrangler deploy