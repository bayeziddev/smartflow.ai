name: Deploy Backend (Cloudflare Workers)

# This is the file that means "push to GitHub" is the only step you
# need — no manual wrangler deploy, no dashboard clicking. Only runs
# when something under backend-workers/ actually changed, so editing
# the frontend or marketing site won't trigger a pointless redeploy.
"on":
  push:
    branches: [main]
    paths:
      - "backend-workers/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
