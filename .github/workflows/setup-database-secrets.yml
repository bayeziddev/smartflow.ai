name: Setup Database & Secrets (Cloudflare Workers)

# One-time setup workflow, triggered manually from the Actions tab.
# Not meant to be run repeatedly — running it twice would create a
# second, separate Hyperdrive config rather than reuse the first one.
"on":
  workflow_dispatch:

permissions:
  contents: write # needed so this workflow can commit the real Hyperdrive id back to wrangler.jsonc

jobs:
  setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      # Reuses the SAME two secrets your existing deploy workflow
      # already uses — no new Cloudflare secrets needed beyond
      # DB_CONNECTION_STRING.
      - name: Set up database, secrets, and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          echo "=== 1. Generating & setting secure secrets ==="
          node -e "console.log(require('crypto').randomBytes(32).toString('hex'))" | npx wrangler secret put JWT_SECRET
          node -e "console.log(require('crypto').randomBytes(32).toString('hex'))" | npx wrangler secret put ENCRYPTION_MASTER_KEY

          echo "=== 2. Creating Cloudflare Hyperdrive ==="
          OUTPUT=$(npx wrangler hyperdrive create fanchatbot-new --connection-string="$DB_CONNECTION_STRING")
          echo "$OUTPUT"

          echo "=== 3. Extracting Hyperdrive ID ==="
          # Wrangler's real output quotes the key too: "id": "value" —
          # matching that exact shape, not id: "value".
          HYPERDRIVE_ID=$(echo "$OUTPUT" | grep -o '"id": "[^"]*"' | head -1 | cut -d'"' -f4)

          if [ -z "$HYPERDRIVE_ID" ]; then
            echo "Could not automatically extract the ID from the output above."
            echo "Open backend-workers/wrangler.jsonc yourself and paste the id in manually, then re-run just the deploy step."
            exit 1
          fi

          echo "Found Hyperdrive ID: $HYPERDRIVE_ID"
          sed -i "s/REPLACE_WITH_YOUR_HYPERDRIVE_ID/$HYPERDRIVE_ID/g" wrangler.jsonc

          echo "=== 4. Committing the real ID back to the repo ==="
          # Without this, the NEXT push-triggered deploy would still see
          # the placeholder text and fail.
          git config user.name "setup-workflow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add wrangler.jsonc
          if git diff --cached --quiet; then
            echo "wrangler.jsonc already up to date, nothing to commit."
          else
            git commit -m "Set real Hyperdrive ID in wrangler.jsonc [skip ci]"
            git push
          fi

          echo "=== 5. Deploying to Cloudflare Workers ==="
          npx wrangler deploy
