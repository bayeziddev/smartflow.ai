name: Setup Database & Secrets (Cloudflare Workers)

# One-time setup workflow, triggered manually from the Actions tab.
# Safe to re-run — it just overwrites the same Worker secrets with
# fresh values and redeploys.
#
# NOTE: backend-workers connects to the database directly (see
# src/db/client.js), not through Cloudflare Hyperdrive — Hyperdrive's
# MySQL proxy doesn't support the AuthSwitchRequest handshake TiDB
# Cloud uses (see https://github.com/cloudflare/workers-sdk/issues,
# error code 2015), so this workflow parses DB_CONNECTION_STRING and
# sets DB_USER / DB_PASSWORD as Worker secrets instead of provisioning
# a Hyperdrive config. DB_HOST / DB_PORT / DB_DATABASE are plain vars
# in wrangler.jsonc since they aren't sensitive.
"on":
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Set up database credentials, secrets, and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          set -e

          echo "=== 1. Parsing DB_USER / DB_PASSWORD out of DB_CONNECTION_STRING ==="
          # Expected shape: mysql://user:password@host:port/database
          eval "$(node -e '
            const raw = process.env.DB_CONNECTION_STRING;
            if (!raw) { console.error("DB_CONNECTION_STRING secret is not set."); process.exit(1); }
            const u = new URL(raw);
            if (!u.username || !u.password) { console.error("Connection string is missing a username or password."); process.exit(1); }
            console.log(`export DB_USER_VALUE=${JSON.stringify(decodeURIComponent(u.username))}`);
            console.log(`export DB_PASSWORD_VALUE=${JSON.stringify(decodeURIComponent(u.password))}`);
          ')"

          echo "=== 2. Setting database secrets ==="
          printf '%s' "$DB_USER_VALUE" | npx wrangler secret put DB_USER
          printf '%s' "$DB_PASSWORD_VALUE" | npx wrangler secret put DB_PASSWORD

          echo "=== 3. Generating & setting app secrets ==="
          node -e "console.log(require('crypto').randomBytes(32).toString('hex'))" | npx wrangler secret put JWT_SECRET
          node -e "console.log(require('crypto').randomBytes(32).toString('hex'))" | npx wrangler secret put ENCRYPTION_MASTER_KEY

          echo "=== 4. Deploying to Cloudflare Workers ==="
          npx wrangler deploy
