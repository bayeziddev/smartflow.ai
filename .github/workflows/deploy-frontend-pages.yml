name: Deploy Frontend (GitHub Pages)

# Push to main touching frontend/ → this builds and publishes it to
# GitHub Pages automatically. No separate hosting account needed.
"on":
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight one finish
# rather than racing two builds against the same site.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          GITHUB_PAGES: "true"
          # Frontend and backend live on different origins (GitHub
          # Pages vs Workers), so this must be an absolute URL, not
          # the "/api" same-origin default used in local dev.
          VITE_API_BASE_URL: https://fanchatbot-backend.sayadmdbayezidhosan.workers.dev/api
        run: npm run build

      # GitHub Pages has no server-side rewrites, so a hard refresh (or
      # a shared link) on any client-side route like /login would 404
      # without this — copying index.html to 404.html means GitHub
      # Pages serves the app shell for unknown paths, and React Router
      # takes over from there.
      - name: Add SPA fallback for client-side routing
        run: cp dist/index.html dist/404.html

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
